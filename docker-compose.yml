# One-command local run (bonus B6) — not a deployment manifest. The
# secrets below are intentionally fake placeholders, same spirit as the
# "changeme" values in apps/cms/.env.example — fine for a throwaway local
# stack, never meant to back a real deployment. Override any of them via a
# root-level .env file (docker compose reads it automatically) if needed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lerevenu}
      POSTGRES_USER: ${DATABASE_USERNAME:-lerevenu}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lerevenu}
    volumes:
      - lerevenu_compose_pgdata:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-lerevenu} -d ${DATABASE_NAME:-lerevenu}']
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:-devKey1,devKey2,devKey3,devKey4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-devApiTokenSalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-devAdminJwtSecret}
      JWT_SECRET: ${JWT_SECRET:-devJwtSecret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-devTransferTokenSalt}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-devEncryptionKey}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-lerevenu}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-lerevenu}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-lerevenu}
      DATABASE_SSL: 'false'
    ports:
      - '1337:1337'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:1337/_health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      cms:
        condition: service_healthy
    environment:
      # Server-only — never shipped to the browser (see lib/strapi/client.ts).
      STRAPI_URL: http://cms:1337
    ports:
      - '3000:3000'

volumes:
  lerevenu_compose_pgdata:
